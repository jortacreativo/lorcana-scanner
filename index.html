<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Lorcana Scanner V1</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
    header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:10}
    header h1{font-size:20px;margin:0 0 4px} header p{margin:0;font-size:13px;opacity:.8}
    main{max-width:900px;margin:auto;padding:16px}
    .card{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #00000010}
    button,.file-label{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer;background:#111827;color:white;display:inline-block}
    button.secondary{background:#e5e7eb;color:#111827} button:disabled{opacity:.5;cursor:not-allowed}
    input[type=file]{display:none}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    #preview{width:100%;max-height:55vh;object-fit:contain;background:#111827;border-radius:12px;margin-top:12px}
    .status{font-size:14px;margin-top:10px;white-space:pre-wrap;line-height:1.4;background:#f9fafb;padding:12px;border-radius:8px;border-left:3px solid #111827}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .result{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fff}
    .result img{width:100%;aspect-ratio:0.69;object-fit:cover;border-radius:9px;background:#eee}
    .confidence{font-weight:800;margin:7px 0}.green{color:#15803d}.yellow{color:#a16207}.red{color:#b91c1c}
    .small{font-size:12px;color:#6b7280}.hidden{display:none}
    .progress-bar{width:100%;height:4px;background:#e5e7eb;border-radius:2px;margin-top:8px;overflow:hidden}
    .progress-fill{height:100%;background:#111827;width:0%;transition:width 0.3s}
    .debug{background:#fef3c7;border:1px solid #fcd34d;padding:10px;border-radius:6px;margin-top:10px;font-size:11px;font-family:monospace;color:#78350f}
    .toggle{cursor:pointer;padding:8px;margin-top:8px;background:#f3f4f6;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
<header>
  <h1>🃏 Lorcana Scanner V1</h1>
  <p>Prototipo gratuito: foto → OCR → búsqueda en catálogo</p>
</header>

<main>
  <section class="card">
    <div class="actions">
      <label class="file-label" for="photo">📷 Tomar / elegir foto</label>
      <input id="photo" type="file" accept="image/*" capture="environment">
      <button id="scan" disabled>🔎 Escanear</button>
      <button id="clear" class="secondary">Limpiar</button>
    </div>
    <img id="preview" class="hidden" alt="Vista previa">
    <div id="status" class="status">Cargando catálogo...</div>
    <div id="progress" class="progress-bar hidden"><div class="progress-fill"></div></div>
    <div class="toggle" onclick="toggleDebug()">📊 Ver detalles OCR</div>
    <div id="debug" class="debug hidden"></div>
  </section>

  <section class="card">
    <strong>Resultados</strong>
    <p class="small">Coincidencias detectadas. Confirma las que te interesen.</p>
    <div id="results" class="grid"></div>
  </section>

  <section class="card">
    <strong>Inventario local</strong>
    <p class="small">Las cartas se guardan en este navegador. No se envían a servidor.</p>
    <div class="actions">
      <button id="export" class="secondary">⬇️ Exportar CSV</button>
      <button id="resetInventory" class="secondary">Borrar inventario</button>
    </div>
    <div id="inventorySummary" class="status"></div>
  </section>
</main>

<!-- Tesseract.js desde CDN confiable -->
<script src="https://unpkg.com/tesseract.js-core@v4.0.0/tesseract-core.min.js"></script>
<script src="https://unpkg.com/tesseract.js@v5.1.0/dist/tesseract.min.js"></script>

<script>
const CATALOG_FILE = "./allCards.json";

let catalog = [];
let selectedFile = null;
let inventory = JSON.parse(localStorage.getItem("lorcanaInventoryV1") || "[]");
let isScanning = false;
let debugMode = false;

const $ = id => document.getElementById(id);
const normalize = s => (s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim();

function setStatus(text) { $("status").textContent = text; }

function setProgress(percent) {
  const bar = $("progress");
  if(percent <= 0) {
    bar.classList.add("hidden");
  } else {
    bar.classList.remove("hidden");
    bar.querySelector(".progress-fill").style.width = percent + "%";
  }
}

function toggleDebug() {
  debugMode = !debugMode;
  const d = $("debug");
  if(debugMode) {
    d.classList.remove("hidden");
  } else {
    d.classList.add("hidden");
  }
}

function log(msg) {
  console.log("[Lorcana Scanner]", msg);
  if(debugMode) {
    $("debug").innerHTML += msg + "<br>";
  }
}

async function loadCatalog(){
  try{
    log("Cargando catálogo desde: " + CATALOG_FILE);
    setStatus("📥 Cargando catálogo...");
    setProgress(30);

    const response = await fetch(CATALOG_FILE);
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    
    setProgress(60);
    const data = await response.json();
    catalog = data.cards || data || [];
    
    setProgress(90);
    
    if(!catalog || catalog.length === 0) {
      throw new Error("El catálogo no contiene cartas");
    }
    
    log(`✓ Catálogo cargado: ${catalog.length} cartas`);
    setProgress(100);
    setTimeout(() => setProgress(0), 500);
    
    setStatus(`✓ Catálogo listo: ${catalog.length} cartas.\n\nSelecciona una foto y toca Escanear.`);

  }catch(e){
    log("Error en loadCatalog: " + e.message);
    setProgress(0);
    setStatus(`❌ Error al cargar catálogo:\n${e.message}`);
  }
}

// Preprocesamiento de imagen para mejorar OCR
async function preprocessImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      
      // Dibujar imagen original
      ctx.drawImage(img, 0, 0);
      
      // Obtener datos de píxeles
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      // Conversión a escala de grises + aumento de contraste
      for(let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        
        // Escala de grises (luminancia)
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;
        
        // Aumento de contraste (gamma correction)
        gray = Math.pow(gray / 255, 0.5) * 255;
        
        data[i] = gray;      // R
        data[i + 1] = gray;  // G
        data[i + 2] = gray;  // B
      }
      
      ctx.putImageData(imageData, 0, 0);
      canvas.toBlob(resolve, "image/jpeg", 0.95);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("photo").addEventListener("change", e=>{
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  $("preview").src = URL.createObjectURL(selectedFile);
  $("preview").classList.remove("hidden");
  $("scan").disabled = false;
  setStatus("✓ Foto lista. Pulsa Escanear.");
});

function tokenScore(text, card){
  const hay = normalize([
    card.fullName, card.simpleName, card.name, card.title,
    card.setName, card.number, card.collectorNumber
  ].filter(Boolean).join(" "));
  const tokens = normalize(text).split(" ").filter(x=>x.length>2);
  if(!tokens.length) return 0;
  let hits = 0;
  for(const t of tokens) if(hay.includes(t)) hits++;
  return hits / tokens.length;
}

function getImage(card){
  return card?.images?.full || card?.images?.thumbnail || card?.imageUrl || "";
}

function cardLabel(card){
  return card.fullName || card.simpleName || card.name || "Carta Lorcana";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function renderResults(matches, ocrText){
  $("results").innerHTML = "";
  if(!matches.length){
    $("results").innerHTML = `<div class="small">Sin coincidencias claras.\n\nTexto detectado:\n${escapeHtml(ocrText.substring(0,300))}</div>`;
    return;
  }
  for(const m of matches){
    const div = document.createElement("div");
    div.className = "result";
    const pct = Math.round(m.score*100);
    const cls = pct >= 80 ? "green" : pct >= 55 ? "yellow" : "red";
    div.innerHTML = `
      ${getImage(m.card) ? `<img src="${getImage(m.card)}" loading="lazy" alt="">` : ""}
      <div class="confidence ${cls}">${pct}%</div>
      <strong>${escapeHtml(cardLabel(m.card))}</strong>
      <div class="small">${escapeHtml(m.card.setName || "")} #${escapeHtml(String(m.card.number || ""))}</div>
      <button style="margin-top:9px;width:100%">✓ Confirmar</button>
    `;
    div.querySelector("button").addEventListener("click", ()=>confirmCard(m.card));
    $("results").appendChild(div);
  }
}

async function scan(){
  if(isScanning || !selectedFile || !catalog.length) return;
  isScanning = true;
  $("scan").disabled = true;
  
  try {
    setStatus("📤 Preparando foto...");
    setProgress(20);
    
    log("Iniciando preprocesamiento de imagen...");
    const processedBlob = await preprocessImage(selectedFile);
    log("✓ Imagen preprocesada (escala de grises + contraste)");
    
    setStatus("🔍 Procesando OCR con Tesseract.js...");
    setProgress(30);

    // Configuración mejorada de Tesseract.js
    const { data } = await Tesseract.recognize(processedBlob, "eng", {
      logger: (m) => {
        if(m.status === "recognizing text") {
          const progress = Math.min(90, 30 + Math.round((m.progress || 0) * 60));
          setProgress(progress);
          log(`OCR: ${Math.round((m.progress || 0) * 100)}%`);
        }
      },
      tessedit_pageseg_mode: Tesseract.PSM.AUTO,
      tesseract_config_values: {
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 -'"
      }
    });

    const text = (data.text || "").trim();
    log("Texto OCR (raw): " + text.substring(0, 100));
    
    if(!text) {
      setProgress(0);
      setStatus("⚠️ No se detectó texto en la imagen.\nIntenta con una foto más clara.");
      return;
    }

    setStatus("🔎 Buscando en catálogo...");
    setProgress(75);

    const ranked = catalog
      .map(card=>({card,score:tokenScore(text,card)}))
      .filter(x=>x.score>0)
      .sort((a,b)=>b.score-a.score)
      .slice(0,8);

    setProgress(90);
    log(`✓ Coincidencias encontradas: ${ranked.length}`);
    renderResults(ranked, text);
    
    setProgress(100);
    setTimeout(() => setProgress(0), 500);
    
    setStatus(`✓ Listo.\n\nTexto detectado:\n${text.substring(0,250)}`);

  } catch(e) {
    setProgress(0);
    log("ERROR en scan: " + e.message);
    console.error(e);
    setStatus(`❌ Error:\n${e.message}`);
  } finally {
    isScanning = false;
    $("scan").disabled = false;
  }
}

function confirmCard(card){
  inventory.push({
    id: card.id || "",
    name: cardLabel(card),
    set: card.setName || "",
    number: card.number || "",
    rarity: card.rarity || "",
    addedAt: new Date().toISOString()
  });
  localStorage.setItem("lorcanaInventoryV1",JSON.stringify(inventory));
  updateInventory();
  log("Carta confirmada: " + cardLabel(card));
}

function updateInventory(){
  $("inventorySummary").textContent = `${inventory.length} cartas registradas en este navegador.`;
}

$("scan").addEventListener("click", scan);
$("clear").addEventListener("click",()=>{
  selectedFile=null; $("photo").value=""; $("preview").classList.add("hidden"); $("results").innerHTML="";
  setProgress(0);
  setStatus(catalog.length ? `✓ Catálogo: ${catalog.length} cartas.` : "Cargando...");
});
$("resetInventory").addEventListener("click",()=>{
  if(confirm("¿Borrar inventario?")){
    inventory=[]; localStorage.removeItem("lorcanaInventoryV1"); updateInventory();
  }
});
$("export").addEventListener("click",()=>{
  const rows=[["name","set","number","rarity","addedAt"],...inventory.map(x=>[x.name,x.set,x.number,x.rarity,x.addedAt])];
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="lorcana-inventory.csv"; a.click();
});

updateInventory();
loadCatalog();
</script>
</body>
</html>
